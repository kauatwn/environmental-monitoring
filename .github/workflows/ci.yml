name: "PlatformIO CI"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    name: "Check Formatting"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Python 🐍"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Clang-Format 🔧"
        run: pip install -r requirements.txt

      - name: "Check Code Formatting (Clang-Format) 🎨"
        run: |
          find src include lib -type f \
            \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            -exec clang-format --dry-run --Werror {} +

  analysis:
    name: "Static Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Python 🐍"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Cache PlatformIO 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: "Install Dependencies 🔧"
        run: pip install -r requirements.txt

      - name: "Run Static Analysis (Clang-Tidy) 🔍"
        run: pio check --fail-on-defect=low

  build:
    name: "Build Arduino Uno Firmware"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [format, analysis]
    outputs:
      has-wokwi-token: ${{ steps.check-token.outputs.has-token }}

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Python 🐍"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Cache PlatformIO 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: "Install Dependencies 🔧"
        run: pip install -r requirements.txt

      - name: "Build Arduino Uno Firmware 🔨"
        run: pio run -e uno

      - name: "Generate Firmware Integrity Checksums 🔐"
        run: |
          cd .pio/build/uno
          sha256sum firmware.hex firmware.elf > SHA256SUMS
          cat SHA256SUMS

      - name: "Upload Firmware Artifacts 📤"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arduino-uno-firmware
          path: |
            .pio/build/uno/firmware.hex
            .pio/build/uno/firmware.elf
            .pio/build/uno/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: "Check Wokwi Token Presence 🔑"
        id: check-token
        env:
          WOKWI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          if [ -n "$WOKWI_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

  wokwi-simulation:
    name: "Wokwi Simulation Tests (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [build]
    if: needs.build.outputs.has-wokwi-token == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Normal Temperature"
            scenario: "test/wokwi/test_temp_normal.yaml"
          - name: "Warning Temperature"
            scenario: "test/wokwi/test_temp_warning.yaml"
          - name: "Critical Temperature"
            scenario: "test/wokwi/test_temp_critical.yaml"
          - name: "Darkness Condition"
            scenario: "test/wokwi/test_light_dark.yaml"
          - name: "Alarm Mute Toggle"
            scenario: "test/wokwi/test_alarm_toggle.yaml"

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download Firmware Artifact 📥"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: arduino-uno-firmware
          path: .pio/build/uno

      - name: "Run Wokwi Test: ${{ matrix.name }} 🧪"
        uses: wokwi/wokwi-ci-action@11ddc3fe66a14fcd46683fb21ae5c77657ad4606 # v1.2.0
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: .
          scenario: ${{ matrix.scenario }}
          timeout: 10000
